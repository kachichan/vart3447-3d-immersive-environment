# Spatial Media course site — GitHub Pages / Jekyll config.
# The site uses its own layout (_layouts/default.html) and
# stylesheet (assets/css/site.css). No theme.

title: 3D Immersive Environment
description: "VART3447 · 3D Immersive Environment · Academy of Visual Arts, HKBU · Semester 1, 2026–27"

# Apply the custom layout to every page automatically, so the
# markdown files don't need a `layout:` line.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Lets links between .md files work both in the repo view and on
# the published site.
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

# Don't publish repo housekeeping to the site.
exclude:
  - README.md
